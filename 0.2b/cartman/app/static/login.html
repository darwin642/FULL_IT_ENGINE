<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · Cartman</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #eef2f8; background: #0c111b;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .panel {
      width: 100%; max-width: 410px; padding: 36px;
      background: #141c29; border: 1px solid #2a3547; border-radius: 18px;
      box-shadow: 0 24px 80px #0005;
    }
    .brand { font-size: 13px; letter-spacing: .18em; font-weight: 800; color: #9dbaff; }
    h1 { margin: 22px 0 6px; font-size: 28px; letter-spacing: -.03em; }
    .sub { color: #a6b2c4; margin: 0 0 26px; }
    label { display: block; font-size: 13px; margin: 17px 0 7px; color: #d7deea; }
    input {
      width: 100%; padding: 12px 13px; color: #f3f6fb; background: #0c121d;
      border: 1px solid #36445a; border-radius: 9px; outline: none;
      font: inherit;
    }
    input:focus { border-color: #82a8ff; box-shadow: 0 0 0 3px #82a8ff22; }
    button {
      width: 100%; margin-top: 23px; padding: 12px;
      border: 0; border-radius: 9px; background: #7298f6; color: #081326;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #feedback { min-height: 24px; margin: 13px 0 0; color: #ffb3b3; font-size: 13px; }
    .foot { margin-top: 23px; color: #8592a7; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">CARTMAN</div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your IT operations workspace.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username"
             required minlength="3" maxlength="80" autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required maxlength="1024">
      <button id="submit" type="submit">Sign in</button>
      <p id="feedback" role="alert" aria-live="polite"></p>
    </form>
    <div class="foot">Authorized access only · Cartman</div>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const button = document.getElementById("submit");
    const feedback = document.getElementById("feedback");

    fetch("/api/auth/me", { credentials: "same-origin" })
      .then(response => {
        if (response.ok) window.location.replace("/");
      })
      .catch(() => {});

    form.addEventListener("submit", async event => {
      event.preventDefault();
      button.disabled = true;
      feedback.textContent = "";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value
          })
        });

        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(result.detail || "Sign-in failed.");
        }

        form.reset();
        window.location.replace("/");
      } catch (error) {
        feedback.textContent = error.message || "Unable to sign in.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
