<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Change password · Cartman</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #eef2f8; background: #0c111b;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .panel {
      width: 100%; max-width: 440px; padding: 34px;
      background: #141c29; border: 1px solid #2a3547; border-radius: 18px;
      box-shadow: 0 24px 80px #0005;
    }
    .brand {
      font-size: 13px; letter-spacing: .18em; font-weight: 800; color: #9dbaff;
    }
    h1 { margin: 22px 0 6px; font-size: 27px; }
    .sub { color: #a6b2c4; margin: 0 0 24px; }
    label { display: block; font-size: 13px; margin: 16px 0 7px; color: #d7deea; }
    input {
      width: 100%; padding: 12px 13px; color: #f3f6fb; background: #0c121d;
      border: 1px solid #36445a; border-radius: 9px; outline: none;
      font: inherit;
    }
    input:focus { border-color: #82a8ff; box-shadow: 0 0 0 3px #82a8ff22; }
    button {
      width: 100%; margin-top: 22px; padding: 12px;
      border: 0; border-radius: 9px; background: #7298f6; color: #081326;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #feedback { min-height: 24px; margin: 13px 0 0; color: #ffb3b3; font-size: 13px; }
    .hint { color: #8592a7; font-size: 12px; margin-top: 14px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">CARTMAN</div>
    <h1>Change your password</h1>
    <p class="sub">
      Your administrator requires a new password before you can continue.
    </p>
    <form id="password-form">
      <label for="new-password">New password</label>
      <input id="new-password" name="new_password" type="password"
             autocomplete="new-password" minlength="14" maxlength="128" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirm_password" type="password"
             autocomplete="new-password" minlength="14" maxlength="128" required>
      <button id="submit" type="submit">Update password</button>
      <p id="feedback" role="alert" aria-live="polite"></p>
    </form>
    <p class="hint">Use at least 14 characters. Do not reuse a password from another service.</p>
  </main>
  <script>
    const form = document.getElementById("password-form");
    const button = document.getElementById("submit");
    const feedback = document.getElementById("feedback");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      button.disabled = true;
      feedback.textContent = "";

      const newPassword = form.elements.new_password.value;
      const confirmPassword = form.elements.confirm_password.value;

      if (newPassword !== confirmPassword) {
        feedback.textContent = "The new passwords do not match.";
        button.disabled = false;
        return;
      }

      try {
        const response = await fetch("/api/auth/password/change", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            new_password: newPassword,
            confirm_password: confirmPassword
          })
        });

        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(result.detail || "Could not update password.");
        }

        form.reset();
        window.location.replace("/");
      } catch (error) {
        feedback.textContent = error.message || "Could not update password.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
